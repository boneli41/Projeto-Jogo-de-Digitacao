<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digita Comigo — Resultado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="result">
  <div class="page">
    <div id="result-bg" class="bg-layer"></div>
    <div class="scene-overlay"></div>

    <div class="page-content">
      <h1 class="result-header result-header-image">
        <img src="assets/header-resultado.png" alt="Resultado da sessão" />
      </h1>

      <div class="result-center-wrap">
        <div class="rounded-card result-card">
          <div id="result-message" class="result-message"></div>

          <div class="stats-grid">
            <div class="stat-card"><div class="title">Vidas</div><div id="stat-lives" class="value"></div></div>
            <div class="stat-card"><div class="title">Pontuação</div><div id="stat-score" class="value"></div></div>
            <div class="stat-card"><div class="title">Sequência</div><div id="stat-streak" class="value"></div></div>
            <div class="stat-card"><div class="title">Tempo total de prática</div><div id="stat-time" class="value"></div></div>
            <div class="stat-card"><div class="title">PPM médio</div><div id="stat-wpm" class="value"></div></div>
            <div class="stat-card"><div class="title">Frases concluídas</div><div id="stat-completed" class="value"></div></div>
            <div class="stat-card"><div class="title">Precisão</div><div id="stat-accuracy" class="value"></div></div>
            <div class="stat-card"><div class="title">Melhor sequência</div><div id="stat-best-streak" class="value"></div></div>
            <div class="stat-card"><div class="title">Estrelas acumuladas</div><div id="stat-stars" class="value"></div></div>
            <div class="stat-card"><div class="title">Módulos finalizados</div><div id="stat-modules" class="value"></div></div>
            <div class="stat-card"><div class="title">Caracteres corretos / digitados</div><div id="stat-characters" class="value"></div></div>
          </div>

          <div id="auto-advance-hint" class="auto-advance-hint"></div>
        </div>
      </div>

      <div class="result-footer">
        <button id="btn-finish" class="btn-modern" style="background:var(--color-primary)">VOLTAR AO MENU</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
