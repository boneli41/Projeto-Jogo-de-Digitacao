<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digita Comigo — Jogando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="game">
  <div class="page">
    <div id="game-bg" class="bg-layer"></div>
    <div class="scene-overlay"></div>

    <div class="page-content">
      <div class="game-topbar">
        <div class="game-player">
          <button id="profile-avatar" class="game-avatar" type="button" data-avatar="profile-1" aria-label="Avatar: perfil 1. Trocar foto de perfil" title="Clique para trocar a foto de perfil">
            <span class="avatar-change" aria-hidden="true">↻</span>
          </button>
          <div class="game-player-details">
            <span class="game-meta-label">Jogador</span>
            <div id="player-name" class="player-name"></div>
          </div>
        </div>
        <div class="game-lives">
          <span class="game-meta-label">Vidas</span>
          <div id="hearts" class="hearts"></div>
        </div>
        <div class="game-module">
          <span class="game-meta-label">Seu progresso</span>
          <span id="module-label-left" class="module-stepper-label"></span>
          <span id="module-label-right" class="module-stepper-label"></span>
        </div>
        <div class="game-status">
          <span class="game-meta-label">Pontuação</span>
          <div id="score-text" class="score-text"></div>
        </div>
        <div class="game-streak">
          <span class="game-meta-label">Sequência</span>
          <strong id="side-streak"></strong>
        </div>
        <div class="game-actions">
          <button id="btn-pause" class="btn-modern pause-btn">Pausar</button>
          <button id="btn-exit" class="btn-modern exit-btn" title="Esc">Sair (Esc)</button>
        </div>
      </div>

      <div class="game-time-row">
        <div id="time-progress" class="time-progress" role="progressbar" aria-label="Tempo restante do desafio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div id="time-progress-fill" class="time-progress-fill"></div>
        </div>
        <div id="timer-text" class="timer-text" role="timer" aria-label="Tempo restante"></div>
      </div>

      <div class="game-body">
        <div class="game-center">
          <div class="rounded-card exercise-card">
            <div id="exercise-text" class="exercise-text"></div>
            <div id="feedback" class="feedback"></div>
          </div>

          <div class="input-row">
            <label for="game-input" class="prompt-label">Digite aqui:</label>
            <input id="game-input" type="text" class="game-input" placeholder="Comece a digitar aqui..." autocomplete="off" spellcheck="false" />
          </div>
          <div id="keyboard-container" class="keyboard-wrap" aria-label="Teclado auxiliar"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
